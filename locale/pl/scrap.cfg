[mod-setting-description]
yis-material-source=Zrodlo
yis-needed=Bazowy cel dla receptur recyklingu. Wyższe wartości zwykle zwiększają wymagany złom, zmniejszają ilość wytwarzanych płynów i zwiększają rozmiar stosu złomu.
yis-probability=Prawdopodobienstwo uzyskania zlomu.
yis-fixed-amount=Tworzy stale ilosci zlomu. Po wylaczeniu generowane sa losowe zakresy z amount_min i amount_max.
yis-amount-limit=Wygladza bardzo duze ilosci skladnikow, aby ekstremalne receptury nie tworzyly nadmiernych ilosci zlomu. Po wylaczeniu zlom jest obliczany liniowo z ilosci skladnika i prawdopodobienstwa.\n\nUwaga: wylaczenie obu opcji ([img=sigma-symbol] i [img=fixed-symbol]) moze dzialac podobnie do obnizenia kosztu.
yis-hide-tech=Ukrywa automatycznie generowane technologie recyklingu w drzewie technologii. Gdy krotkie logowanie jest wlaczone, technologie pozostaja widoczne, aby ulatwic testy w grze.
yis-ancestry-mode=Steruje ogolnym stylem uzywanym, gdy receptury komponentow sa sledzone z powrotem do rodzin materialow. Dokladna mieszanka nie jest gwarantowana dla kazdej kombinacji modow.
yis-ancestry-max-depth=Nadpisuje liczbę kroków receptur, które Ingredient Scrap może śledzić przy rozpoznawaniu komponentów do rodzin materiałów.
yis-ancestry-mixed-limit=Nadpisuje liczbę rodzin materiałów, które rozpoznany składnik może emitować bezpośrednio, zanim przejdzie na mieszany złom.
yis-material-mode=Okresla, jak Ingredient Scrap traktuje ten material: auto uzywa normalnego wykrywania, solid wymusza tylko materialy stale, fluid wymusza tylko plyny, both wymusza oba, a none calkowicie ignoruje material.
yis-shallow-log=Zapisuje krotkie podsumowania waznych krokow moda do pliku dziennika Factorio. Przydatne przy zglaszaniu bledow i mozliwe do wylaczenia, gdy dziennik ma pozostac cichy.
yis-fluid-recipes=Wewnetrzne ustawienie zgodnosci. Wykrywanie plynnych skladnikow i recykling plynow sa obecnie zawsze wlaczone.

[string-mod-setting]
yis-ancestry-mode-component-heavy=++ zlom komponentow, zlom, - mieszany
yis-ancestry-mode-balanced=+ zlom komponentow, + zlom, mieszany
yis-ancestry-mode-material-heavy=zlom komponentow, ++ zlom, + mieszany

[string-mod-setting-description]
yis-ancestry-mode-component-heavy=Preferuje obecne rodziny komponentow i unika mieszanego zlomu, gdy to mozliwe.
yis-ancestry-mode-balanced=Używa hybrydowego resolvera: proste komponenty mogą przejść w złom materiałowy, a szersze łańcuchy mogą przejść w mieszany złom.
yis-ancestry-mode-material-heavy=Sledzi receptury bardziej agresywnie w strone materialow pochodzacych z zasobow i pozwala na mieszany zlom dla szerokich lub nierozwiazanych lancuchow.
