[item-description]
yis-scrap-description=Zlom odzyskany z receptur, ktore uzywaja rodziny materialow __1__. Przetworz go, aby odzyskac pasujace materialy.
yis-mixed-scrap=Zlom awaryjny dla zlozonych, szerokich lub nierozwiazanych lancuchow receptur. Recykling sortuje wazona pule znanych zlomow materialowych.

