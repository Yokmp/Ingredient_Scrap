[tips-and-tricks-item-description]
ingredient-scrap=Ingredient Scrap dodaje zlom materialowy do receptur na podstawie skladnikow, ktore zuzywaja. Wytworzony zlom mozna przetworzyc z powrotem na odpowiednie rodziny materialow.
ingredient-scrap-generation=Gdy receptura zuzywa obslugiwane materialy, moze wytworzyc pasujacy zlom jako dodatkowy wynik. Duze receptury sa wygladzane, aby bardzo duze ilosci skladnikow nie tworzyly skrajnych ilosci zlomu.
ingredient-scrap-recycling=Zlom materialowy jest przetwarzany w maszynach obslugujacych kategorie recyklingu Ingredient Scrap. Recykling zwykle zwraca pasujacy material bazowy, na przyklad zlom zelaza z powrotem w zelazne plytki.
ingredient-scrap-mixed=Mieszany zlom to fallback dla zlozonych receptur, ktorych skladniki rozwiazuja sie do zbyt wielu rodzin materialow. Jest sortowany w recyklerze z uzyciem wazonej puli znanych zlomow, w ktorej czeste materialy pojawiaja sie czesciej.
ingredient-scrap-recycler=Recykler sortuje mieszany zlom i moze tez dzialac jako odplyw zlomu: receptury recyklingu moga zuzywac zlom i zwracac tylko czesc oczekiwanego wyniku. Daje to pozniejszym fabrykom kontrolowany sposob ograniczania nadmiaru zlomu.
ingredient-scrap-fluid=Skladniki plynne oraz materialy stopione lub w roztworze moga tez zostac rozwiazane, gdy znana jest obslugiwana rodzina materialow. Zlozona chemia jest traktowana ostroznie i moze przejsc na mieszany zlom albo ustawienia materialow.
ingredient-scrap-settings=Tryby materialow startowych pozwalaja wymusic solid, fluid, both albo none. Uzyj ich, gdy kombinacja modow potrzebuje jasniejszej reguly niz automatyczne wykrywanie.
