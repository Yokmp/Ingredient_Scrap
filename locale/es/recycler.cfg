[tips-and-tricks-item-description]
ingredient-scrap=Ingredient Scrap agrega chatarra de material a las recetas segun los ingredientes que consumen. La chatarra generada se puede reciclar de nuevo en familias de materiales compatibles.
ingredient-scrap-generation=Cuando una receta consume materiales compatibles, puede producir chatarra correspondiente como resultado adicional. Las recetas grandes se suavizan para que cantidades muy altas de ingredientes no creen salidas extremas de chatarra.
ingredient-scrap-recycling=La chatarra de material se recicla en maquinas que admiten las categorias de reciclaje de Ingredient Scrap. El reciclaje normalmente devuelve el material base correspondiente, como chatarra de hierro de vuelta a placas de hierro.
ingredient-scrap-mixed=La chatarra mezclada es un fallback para recetas complejas cuyos ingredientes se resuelven en demasiadas familias de materiales. Se ordena en el reciclador con un conjunto ponderado de chatarras conocidas, donde los materiales comunes aparecen mas a menudo.
ingredient-scrap-recycler=El reciclador ordena la chatarra mezclada y tambien puede actuar como drenaje de chatarra: las recetas de reciclaje pueden consumir chatarra y devolver solo una parte de la salida esperada. Esto da a las fabricas avanzadas una forma controlada de reducir el exceso de chatarra.
ingredient-scrap-fluid=Los ingredientes fluidos y los materiales fundidos o en solucion tambien pueden resolverse cuando se conoce una familia de materiales compatible. La quimica compleja se trata de forma conservadora y puede usar chatarra mezclada o ajustes de material.
ingredient-scrap-settings=Los modos de material de inicio permiten forzar un material a solid, fluid, both o none. Uselos cuando una combinacion de mods necesite una regla mas clara que la deteccion automatica.
