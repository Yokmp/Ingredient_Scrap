[mod-setting-description]
yis-material-source=Fuente
yis-needed=Objetivo base para las recetas de reciclaje. Los valores mas altos normalmente aumentan la chatarra requerida, reducen los fluidos producidos y aumentan el tamano de pila de la chatarra.
yis-probability=Probabilidad de obtener chatarra.
yis-fixed-amount=Crea cantidades fijas de chatarra. Si se desactiva, se generan rangos aleatorios con amount_min y amount_max.
yis-amount-limit=Suaviza cantidades de ingredientes muy grandes para que las recetas extremas no generen demasiada chatarra. Si se desactiva, la chatarra se calcula linealmente a partir de la cantidad del ingrediente y la probabilidad.\n\nTen en cuenta que desactivar ambas opciones ([img=sigma-symbol] y [img=fixed-symbol]) puede comportarse de forma parecida a una reduccion de coste.
yis-hide-tech=Oculta las tecnologias de reciclaje generadas automaticamente en el arbol tecnologico. Cuando el registro breve esta activado, estas tecnologias permanecen visibles para facilitar las pruebas dentro del juego.
yis-ancestry-mode=Controla el estilo general usado cuando las recetas de componentes se rastrean hasta familias de materiales. La mezcla exacta no esta garantizada para todas las combinaciones de mods.
yis-ancestry-max-depth=Sobrescribe cuantos pasos de receta puede seguir Ingredient Scrap al resolver componentes hasta familias de materiales.
yis-ancestry-mixed-limit=Sobrescribe cuantas familias de materiales puede emitir directamente un ingrediente resuelto antes de convertirse en chatarra mezclada.
yis-material-mode=Controla como Ingredient Scrap trata este material: auto usa la deteccion normal, solid fuerza solo materiales solidos, fluid fuerza solo fluidos, both fuerza ambos y none ignora el material por completo.
yis-shallow-log=Escribe resumenes breves de pasos importantes del mod en el archivo de registro de Factorio. Es util para informes de errores y puede desactivarse para mantener el registro mas limpio.
yis-fluid-recipes=Ajuste interno de compatibilidad. La deteccion de ingredientes fluidos y el reciclaje de fluidos estan siempre activados actualmente.

[string-mod-setting]
yis-ancestry-mode-component-heavy=++ chatarra de componentes, chatarra, - mezclada
yis-ancestry-mode-balanced=+ chatarra de componentes, + chatarra, mezclada
yis-ancestry-mode-material-heavy=chatarra de componentes, ++ chatarra, + mezclada

[string-mod-setting-description]
yis-ancestry-mode-component-heavy=Prefiere las familias de componentes actuales y evita la chatarra mezclada siempre que sea posible.
yis-ancestry-mode-balanced=Usa el resolvedor hibrido: los componentes simples pueden colapsar a chatarra de material, mientras que las cadenas mas amplias pueden convertirse en chatarra mezclada.
yis-ancestry-mode-material-heavy=Rastrea recetas de forma mas agresiva hacia materiales derivados de recursos y permite chatarra mezclada para cadenas amplias o no resueltas.
