[tips-and-tricks-item-description]
ingredient-scrap=Ingredient Scrap fuegt Rezepten Materialschrott hinzu, basierend auf den Zutaten, die sie verbrauchen. Dieser Schrott kann wieder in passende Materialfamilien recycelt werden.
ingredient-scrap-generation=Wenn ein Rezept unterstuetzte Materialien verbraucht, kann es passenden Schrott als zusaetzliches Ergebnis erzeugen. Grosse Rezepte werden geglaettet, damit sehr hohe Zutatenmengen nicht zu extremen Schrottmengen fuehren.
ingredient-scrap-recycling=Materialschrott wird in Maschinen recycelt, die Ingredient-Scrap-Recyclingkategorien unterstuetzen. Recycling gibt meist das passende Grundmaterial zurueck, zum Beispiel Eisenschrott zu Eisenplatten.
ingredient-scrap-mixed=Gemischter Schrott ist ein Fallback fuer komplexe Rezepte, deren Zutaten auf zu viele Materialfamilien aufgeloest werden. Er wird im Recycler sortiert und nutzt dort einen gewichteten Pool bekannter Materialschrotte; haeufige Materialien erscheinen oefter.
ingredient-scrap-recycler=Der Recycler sortiert gemischten Schrott und kann auch als Schrottabfluss dienen: Recycling-Rezepte koennen Schrott verbrauchen und nur einen Teil der erwarteten Ausgabe liefern. So koennen spaete Fabriken ueberschuessigen Schrott kontrolliert abbauen.
ingredient-scrap-fluid=Fluid-Zutaten und geschmolzene oder loesungsartige Materialien koennen ebenfalls aufgeloest werden, wenn eine passende Materialfamilie bekannt ist. Komplexe Chemie wird vorsichtig behandelt und kann auf gemischten Schrott oder Materialeinstellungen zurueckfallen.
ingredient-scrap-settings=Startup-Materialmodi koennen ein Material auf solid, fluid, both oder none festlegen. Nutze sie, wenn eine Mod-Kombination eine klarere Regel braucht als die automatische Erkennung ableiten kann.
