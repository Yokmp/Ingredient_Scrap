[mod-setting-description]
yis-material-source=Quelle
yis-needed=Basiswert für Recycling-Rezepte. Beeinflusst unter anderem die benötigte Schrottmenge, erzeugte Fluidmengen und die Stapelgröße von Schrott.
yis-probability=Wie wahrscheinlich es ist Schrott zu erhalten.
yis-fixed-amount=Erzeugt feste Schrottmengen. Wenn deaktiviert, werden zufällige Mengen mit amount_min und amount_max erzeugt.
yis-amount-limit=Glättet sehr große Zutatenmengen, damit Rezepte mit extrem hohen Eingaben nicht übermäßig viel Schrott erzeugen. Wenn deaktiviert, wird die Schrottmenge linear aus Zutatenmenge und Wahrscheinlichkeit berechnet.\n\nAchtung: Das Deaktivieren beider Optionen ([img=sigma-symbol] und [img=fixed-symbol]) kann ähnlich wie eine Kostenreduktion wirken.
yis-hide-tech=Versteckt die automatisch erzeugten Recycling-Technologien im Technologiebaum. Wenn kurzes Logging aktiv ist, bleiben diese Technologien trotzdem sichtbar, damit Tests im Spiel leichter nachvollziehbar sind.
yis-ancestry-mode=Steuert den groben Stil, mit dem Komponentenrezepte zu Materialfamilien zurueckverfolgt werden. Die genaue Mischung ist bei Mod-Kombinationen nicht garantiert.
yis-ancestry-max-depth=Maximale Anzahl an Rezeptschritten, die Ingredient Scrap beim Aufloesen von Komponenten zu Materialfamilien verfolgen darf.
yis-ancestry-mixed-limit=Maximale Anzahl an Materialfamilien, die ein aufgeloester Bestandteil direkt erzeugen darf, bevor er zu gemischtem Schrott zusammenfaellt.
yis-material-mode=Legt fest, wie Ingredient Scrap dieses Material behandelt: auto nutzt die normale Erkennung, solid erzwingt nur feste Materialien, fluid erzwingt nur Fluid-Materialien, both erzwingt beides, none ignoriert das Material vollständig.
yis-shallow-log=Schreibt kurze Zusammenfassungen wichtiger Mod-Schritte in die Factorio-Logdatei. Hilft bei Bugreports und kann deaktiviert werden, wenn die Logdatei möglichst ruhig bleiben soll.
yis-fluid-recipes=Interne Kompatibilitaetseinstellung. Fluid-Zutaten und Fluid-Recycling sind derzeit immer aktiv.

[string-mod-setting]
yis-ancestry-mode-component-heavy=++ Komponenten-Schrott, Schrott, - Gemischt
yis-ancestry-mode-balanced=+ Komponenten-Schrott, + Schrott, Gemischt
yis-ancestry-mode-material-heavy=Komponenten-Schrott, ++ Schrott, + Gemischt

[string-mod-setting-description]
yis-ancestry-mode-component-heavy=Bevorzugt aktuelle Komponentenfamilien und vermeidet gemischten Schrott wenn moeglich.
yis-ancestry-mode-balanced=Nutzt den geplanten Hybrid-Resolver: einfache Komponenten koennen zu Material-Schrott zusammenfallen, breitere Ketten koennen zu gemischtem Schrott werden.
yis-ancestry-mode-material-heavy=Verfolgt Rezepte aggressiver zurueck zu ressourcenbasierten Materialien und erlaubt gemischten Schrott fuer breite oder nicht aufloesbare Ketten.
