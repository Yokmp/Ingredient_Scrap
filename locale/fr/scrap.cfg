[mod-setting-description]
yis-material-source=Source
yis-needed=Valeur de base pour les recettes de recyclage. Affecte la quantite de rebut requise, les quantites de fluides generees et la taille de pile du rebut.
yis-probability=Probabilite d'obtenir du rebut.
yis-fixed-amount=Cree des quantites de rebut fixes. Si desactive, des plages aleatoires avec amount_min et amount_max sont generees.
yis-amount-limit=Lisse les tres grandes quantites d'ingredients afin que les recettes extremes ne generent pas trop de rebut. Si desactive, la quantite de rebut est calculee lineairement a partir de la quantite d'ingredient et de la probabilite.\n\nAttention : desactiver les deux options ([img=sigma-symbol] et [img=fixed-symbol]) peut se comporter comme une reduction de cout.
yis-hide-tech=Masque les technologies de recyclage generees automatiquement dans l'arbre technologique. Lorsque la journalisation courte est activee, ces technologies restent visibles afin de faciliter les tests en jeu.
yis-ancestry-mode=Controle le style general utilise lorsque les recettes de composants sont retracees vers des familles de materiaux. Le melange exact n'est pas garanti pour toutes les combinaisons de mods.
yis-ancestry-max-depth=Nombre maximal d'etapes de recette qu'Ingredient Scrap peut suivre pour resoudre les composants vers des familles de materiaux.
yis-ancestry-mixed-limit=Nombre maximal de familles de materiaux qu'un ingredient resolu peut emettre directement avant de retomber sur du rebut melange.
yis-material-mode=Controle la facon dont Ingredient Scrap traite ce materiau : auto utilise la detection normale, solid force uniquement les solides, fluid force uniquement les fluides, both force les deux, et none ignore completement le materiau.
yis-shallow-log=Ecrit de courts resumes des etapes importantes du mod dans le fichier journal de Factorio. Utile pour les rapports de bug et peut etre desactive pour garder le journal plus silencieux.
yis-fluid-recipes=Parametre interne de compatibilite. La detection des ingredients fluides et le recyclage des fluides sont actuellement toujours actives.

[string-mod-setting]
yis-ancestry-mode-component-heavy=++ rebut de composants, rebut, - melange
yis-ancestry-mode-balanced=+ rebut de composants, + rebut, melange
yis-ancestry-mode-material-heavy=rebut de composants, ++ rebut, + melange

[string-mod-setting-description]
yis-ancestry-mode-component-heavy=Prefere les familles de composants actuelles et evite le rebut melange quand c'est possible.
yis-ancestry-mode-balanced=Utilise le resolveur hybride prevu : les composants simples peuvent devenir du rebut de materiau, tandis que les chaines plus larges peuvent retomber sur du rebut melange.
yis-ancestry-mode-material-heavy=Suit les recettes plus agressivement vers les materiaux issus des ressources et autorise le rebut melange pour les chaines larges ou non resolues.
