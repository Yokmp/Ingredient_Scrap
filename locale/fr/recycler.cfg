[tips-and-tricks-item-description]
ingredient-scrap=Ingredient Scrap ajoute du rebut de materiau aux recettes selon les ingredients qu'elles consomment. Le rebut genere peut etre recycle vers les familles de materiaux correspondantes.
ingredient-scrap-generation=Lorsqu'une recette consomme des materiaux pris en charge, elle peut produire le rebut correspondant comme resultat supplementaire. Les grandes recettes sont lissees afin que les tres grandes quantites d'ingredients ne creent pas des sorties extremes de rebut.
ingredient-scrap-recycling=Le rebut de materiau est recycle dans les machines qui acceptent les categories de recyclage d'Ingredient Scrap. Le recyclage rend generalement le materiau de base correspondant, comme du rebut de fer vers des plaques de fer.
ingredient-scrap-mixed=Le rebut melange est un fallback pour les recettes complexes dont les ingredients se resolvent en trop de familles de materiaux. Il est trie dans le recycleur avec un pool pondere de rebuts connus, ou les materiaux courants apparaissent plus souvent.
ingredient-scrap-recycler=Le recycleur trie le rebut melange et peut aussi servir de drain a rebut : les recettes de recyclage peuvent consommer du rebut et ne rendre qu'une partie de la sortie attendue. Cela donne aux usines avancees un moyen controle de reduire l'exces de rebut.
ingredient-scrap-fluid=Les ingredients fluides et les materiaux fondus ou en solution peuvent aussi etre resolus lorsqu'une famille de materiaux prise en charge est connue. La chimie complexe reste prudente et peut retomber sur du rebut melange ou des reglages de materiau.
ingredient-scrap-settings=Les modes de materiau au demarrage permettent de forcer un materiau en solid, fluid, both ou none. Utilisez-les quand une combinaison de mods exige une regle plus claire que la detection automatique.
