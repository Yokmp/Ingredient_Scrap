[tips-and-tricks-item-description]
ingredient-scrap=Ingredient Scrap aggiunge rottame di materiale alle ricette in base agli ingredienti consumati. Il rottame generato puo essere riciclato nelle famiglie di materiali corrispondenti.
ingredient-scrap-generation=Quando una ricetta consuma materiali supportati, puo produrre il rottame corrispondente come risultato aggiuntivo. Le ricette grandi vengono smussate per evitare che quantita molto alte di ingredienti creino uscite estreme di rottame.
ingredient-scrap-recycling=Il rottame di materiale viene riciclato nelle macchine che supportano le categorie di riciclaggio di Ingredient Scrap. Di solito il riciclaggio restituisce il materiale base corrispondente, come rottame di ferro in piastre di ferro.
ingredient-scrap-mixed=Il rottame misto e un fallback per ricette complesse i cui ingredienti si risolvono in troppe famiglie di materiali. Viene ordinato nel riciclatore con un pool ponderato di rottami noti, con i materiali comuni che compaiono piu spesso.
ingredient-scrap-recycler=Il riciclatore ordina il rottame misto e puo anche agire come scarico del rottame: le ricette di riciclaggio possono consumare rottame e restituire solo una parte dell'uscita attesa. Questo offre alle fabbriche avanzate un modo controllato per ridurre il rottame in eccesso.
ingredient-scrap-fluid=Anche gli ingredienti fluidi e i materiali fusi o in soluzione possono essere risolti quando e nota una famiglia di materiali supportata. La chimica complessa viene gestita con prudenza e puo ricadere sul rottame misto o sulle impostazioni dei materiali.
ingredient-scrap-settings=Le modalita materiale di avvio permettono di forzare un materiale su solid, fluid, both o none. Usale quando una combinazione di mod richiede una regola piu chiara del rilevamento automatico.
