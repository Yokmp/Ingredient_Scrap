[mod-setting-description]
yis-material-source=Fonte
yis-needed=Obiettivo base per le ricette di riciclaggio. Valori piu alti di solito aumentano il rottame richiesto, riducono i fluidi prodotti e aumentano la dimensione della pila del rottame.
yis-probability=Probabilita di ottenere rottame.
yis-fixed-amount=Crea quantita fisse di rottame. Se disattivato, vengono generati intervalli casuali con amount_min e amount_max.
yis-amount-limit=Smussa quantita di ingredienti molto grandi, cosi le ricette estreme non generano troppo rottame. Se disattivato, il rottame viene calcolato linearmente dalla quantita dell'ingrediente e dalla probabilita.\n\nAttenzione: disattivare entrambe le opzioni ([img=sigma-symbol] e [img=fixed-symbol]) puo comportarsi in modo simile a una riduzione dei costi.
yis-hide-tech=Nasconde nell'albero tecnologico le tecnologie di riciclaggio generate automaticamente. Quando il log breve e attivo, queste tecnologie restano visibili per facilitare i test in gioco.
yis-ancestry-mode=Controlla lo stile generale usato quando le ricette dei componenti vengono ricondotte a famiglie di materiali. La miscela esatta non e garantita per ogni combinazione di mod.
yis-ancestry-max-depth=Sovrascrive quanti passaggi di ricetta Ingredient Scrap puo seguire nel risolvere i componenti verso famiglie di materiali.
yis-ancestry-mixed-limit=Sovrascrive quante famiglie di materiali un ingrediente risolto puo produrre direttamente prima di ricadere nel rottame misto.
yis-material-mode=Controlla come Ingredient Scrap tratta questo materiale: auto usa il rilevamento normale, solid forza solo materiali solidi, fluid forza solo fluidi, both forza entrambi e none ignora completamente il materiale.
yis-shallow-log=Scrive brevi riassunti dei passaggi importanti del mod nel file log di Factorio. Utile per segnalazioni di bug e disattivabile per mantenere il log piu pulito.
yis-fluid-recipes=Impostazione interna di compatibilita. Il rilevamento degli ingredienti fluidi e il riciclaggio dei fluidi sono attualmente sempre attivi.

[string-mod-setting]
yis-ancestry-mode-component-heavy=++ rottame componenti, rottame, - misto
yis-ancestry-mode-balanced=+ rottame componenti, + rottame, misto
yis-ancestry-mode-material-heavy=rottame componenti, ++ rottame, + misto

[string-mod-setting-description]
yis-ancestry-mode-component-heavy=Preferisce le famiglie di componenti attuali ed evita il rottame misto quando possibile.
yis-ancestry-mode-balanced=Usa il resolver ibrido: i componenti semplici possono diventare rottame di materiale, mentre le catene piu ampie possono ricadere nel rottame misto.
yis-ancestry-mode-material-heavy=Segue le ricette piu aggressivamente verso materiali derivati da risorse e consente rottame misto per catene ampie o non risolte.
