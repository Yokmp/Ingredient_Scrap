yis-scrap-description=Rottame recuperato da ricette che usano la famiglia di materiali __1__. Riciclalo per recuperare materiali corrispondenti.
yis-mixed-scrap=Rottame di fallback per catene di ricette complesse, ampie o non risolte. Riciclarlo ordina un pool ponderato di rottami di materiali noti.

