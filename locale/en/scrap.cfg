[mod-setting-description]
yis-material-source=Source
yis-needed=Base value for recycling recipes. Affects the required scrap amount, generated fluid amounts, and scrap stack size.
yis-probability=Probability of getting scrap.
yis-fixed-amount=Creates fixed scrap amounts. When disabled, random ranges with amount_min and amount_max are generated.
yis-amount-limit=Smooths very large ingredient amounts so recipes with extreme inputs do not create excessive scrap. When disabled, scrap is calculated linearly from ingredient amount and probability.\n\nBe aware that disabling both options ([img=sigma-symbol] and [img=fixed-symbol]) can behave similarly to a cost reduction.
yis-hide-tech=Hides the automatically generated recycling technologies in the technology tree. When short logging is enabled, these technologies stay visible so in-game testing is easier to follow.
yis-ancestry-mode=Controls the general style used when component recipes are traced back to material families. The exact mix is not guaranteed for every mod combination.
yis-ancestry-max-depth=Maximum number of recipe steps Ingredient Scrap may follow when resolving component ingredients back to material families.
yis-ancestry-mixed-limit=Maximum number of material families a resolved ingredient may emit directly before it falls back to mixed scrap.
yis-material-mode=Controls how Ingredient Scrap treats this material: auto uses normal detection, solid forces solid materials only, fluid forces fluid materials only, both forces both, and none ignores the material completely.
yis-shallow-log=Writes short summaries of important mod steps to the Factorio log file. Useful for bug reports and can be disabled when the log should stay quiet.
yis-fluid-recipes=Internal compatibility setting. Fluid ingredient detection and fluid recycling are currently always enabled.

[string-mod-setting]
yis-ancestry-mode-component-heavy=++ component scrap, scrap, - mixed
yis-ancestry-mode-balanced=+ component scrap, + scrap, mixed
yis-ancestry-mode-material-heavy=component scrap, ++ scrap, + mixed

[string-mod-setting-description]
yis-ancestry-mode-component-heavy=Prefer current component families and avoid mixed scrap whenever possible.
yis-ancestry-mode-balanced=Use the planned hybrid resolver: simple components can collapse to material scrap while broader chains can fall back to mixed scrap.
yis-ancestry-mode-material-heavy=Follow recipes back toward resource-derived materials more aggressively and allow mixed scrap for broad or unresolved chains.
