[tips-and-tricks-item-description]
ingredient-scrap=Ingredient Scrap adds material scrap to recipes based on the ingredients they consume. The generated scrap can be recycled back into matching material families.
ingredient-scrap-generation=When a recipe consumes supported materials, it can produce matching scrap as an extra result. Large recipes are smoothed so very high ingredient amounts do not create extreme scrap output.
ingredient-scrap-recycling=Material scrap is recycled in machines that support Ingredient Scrap recycling categories. Recycling usually returns the matching base material, such as iron scrap back into iron plates.
ingredient-scrap-mixed=Mixed scrap is a fallback for complex recipes whose ingredients resolve to too many material families. It is sorted in the recycler, where it rolls a weighted pool of known material scraps and common materials appear more often.
ingredient-scrap-recycler=The recycler sorts mixed scrap and can also act as a scrap drain: recycling recipes may consume scrap and return only part of the expected output. This gives late-game factories a controlled way to reduce excess scrap.
ingredient-scrap-fluid=Fluid inputs and molten or solution-style materials can also be resolved when a supported material family is known. Complex chemistry is handled conservatively and may fall back to mixed scrap or material settings.
ingredient-scrap-settings=Startup material modes let you force a material to solid, fluid, both, or none. Use them when a mod combination needs a clearer rule than automatic detection can infer.
