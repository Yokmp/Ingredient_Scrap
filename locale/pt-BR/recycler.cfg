[tips-and-tricks-item-description]
ingredient-scrap=Ingredient Scrap adiciona sucata de material as receitas com base nos ingredientes que elas consomem. A sucata gerada pode ser reciclada de volta em familias de materiais correspondentes.
ingredient-scrap-generation=Quando uma receita consome materiais suportados, ela pode produzir sucata correspondente como resultado adicional. Receitas grandes sao suavizadas para que quantidades muito altas de ingredientes nao criem saidas extremas de sucata.
ingredient-scrap-recycling=A sucata de material e reciclada em maquinas que suportam as categorias de reciclagem do Ingredient Scrap. A reciclagem geralmente devolve o material base correspondente, como sucata de ferro de volta em placas de ferro.
ingredient-scrap-mixed=A sucata mista e um fallback para receitas complexas cujos ingredientes resolvem para muitas familias de materiais. Ela e ordenada no reciclador com um conjunto ponderado de sucatas conhecidas, com materiais comuns aparecendo com mais frequencia.
ingredient-scrap-recycler=O reciclador ordena sucata mista e tambem pode atuar como um dreno de sucata: receitas de reciclagem podem consumir sucata e devolver apenas parte da saida esperada. Isso da as fabricas avancadas uma forma controlada de reduzir o excesso de sucata.
ingredient-scrap-fluid=Ingredientes fluidos e materiais fundidos ou em solucao tambem podem ser resolvidos quando uma familia de materiais suportada e conhecida. Quimica complexa e tratada com cuidado e pode cair em sucata mista ou ajustes de material.
ingredient-scrap-settings=Modos de material de inicializacao permitem forcar um material para solid, fluid, both ou none. Use-os quando uma combinacao de mods precisa de uma regra mais clara que a deteccao automatica.
