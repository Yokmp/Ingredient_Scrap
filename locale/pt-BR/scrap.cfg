[mod-setting-description]
yis-material-source=Origem
yis-needed=Valor base para receitas de reciclagem. Afeta a quantidade de sucata necessaria, as quantidades de fluidos geradas e o tamanho da pilha de sucata.
yis-probability=Probabilidade de obter sucata.
yis-fixed-amount=Cria quantidades fixas de sucata. Quando desativado, intervalos aleatorios com amount_min e amount_max sao gerados.
yis-amount-limit=Suaviza quantidades muito grandes de ingredientes para que receitas extremas nao gerem sucata demais. Quando desativado, a sucata e calculada linearmente a partir da quantidade do ingrediente e da probabilidade.\n\nObserve que desativar ambas as opcoes ([img=sigma-symbol] e [img=fixed-symbol]) pode se comportar de forma parecida com uma reducao de custo.
yis-hide-tech=Oculta as tecnologias de reciclagem geradas automaticamente na arvore tecnologica. Quando o registro curto esta ativado, essas tecnologias continuam visiveis para facilitar testes no jogo.
yis-ancestry-mode=Controla o estilo geral usado quando receitas de componentes sao rastreadas de volta para familias de materiais. A mistura exata nao e garantida para todas as combinacoes de mods.
yis-ancestry-max-depth=Numero maximo de etapas de receita que Ingredient Scrap pode seguir ao resolver componentes de volta para familias de materiais.
yis-ancestry-mixed-limit=Numero maximo de familias de materiais que um ingrediente resolvido pode emitir diretamente antes de cair para sucata mista.
yis-material-mode=Controla como Ingredient Scrap trata este material: auto usa a deteccao normal, solid forca apenas materiais solidos, fluid forca apenas fluidos, both forca ambos e none ignora completamente o material.
yis-shallow-log=Escreve resumos curtos de etapas importantes do mod no arquivo de log do Factorio. Util para relatorios de bug e pode ser desativado para manter o log mais silencioso.
yis-fluid-recipes=Configuracao interna de compatibilidade. A deteccao de ingredientes fluidos e a reciclagem de fluidos estao sempre ativadas atualmente.

[string-mod-setting]
yis-ancestry-mode-component-heavy=++ sucata de componentes, sucata, - mista
yis-ancestry-mode-balanced=+ sucata de componentes, + sucata, mista
yis-ancestry-mode-material-heavy=sucata de componentes, ++ sucata, + mista

[string-mod-setting-description]
yis-ancestry-mode-component-heavy=Prefere as familias atuais de componentes e evita sucata mista sempre que possivel.
yis-ancestry-mode-balanced=Usa o resolvedor hibrido planejado: componentes simples podem virar sucata de material, enquanto cadeias mais amplas podem cair para sucata mista.
yis-ancestry-mode-material-heavy=Rastreia receitas de forma mais agressiva em direcao a materiais derivados de recursos e permite sucata mista para cadeias amplas ou nao resolvidas.
